name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: koi-deployment
  cancel-in-progress: false

jobs:
  build:
    name: Build deployment artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      service_version: ${{ steps.metadata.outputs.service_version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        run: ./scripts/build.sh restore

      - name: Read service metadata
        id: metadata
        shell: bash
        run: |
          service_version="$(dotnet msbuild src/Koi.Functions/Koi.Functions.csproj -getProperty:Version -nologo)"
          if [[ ! "$service_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Project Version is missing or invalid: $service_version" >&2
            exit 1
          fi
          echo "service_version=$service_version" >>"$GITHUB_OUTPUT"

      - name: Run automated tests
        env:
          KOI_BUILD_REVISION: ${{ github.sha }}
        run: ./scripts/build.sh test

      - name: Install pinned Bicep CLI
        run: az bicep install --version v0.46.1

      - name: Publish Function and compile Bicep
        env:
          KOI_BUILD_REVISION: ${{ github.sha }}
        run: ./scripts/build.sh package

      - name: Upload immutable deployment artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: koi-deployment-${{ github.sha }}
          path: artifacts/deployment/
          if-no-files-found: error
          retention-days: 14

  deploy_test:
    name: Deploy test
    needs: build
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-environment.yml
    with:
      deployment_environment: test
      revision: ${{ github.sha }}
      service_version: ${{ needs.build.outputs.service_version }}

  deploy_production:
    name: Deploy production
    needs:
      - build
      - deploy_test
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-environment.yml
    with:
      deployment_environment: production
      revision: ${{ github.sha }}
      service_version: ${{ needs.build.outputs.service_version }}
